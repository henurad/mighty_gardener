# Connections
serial_port: "/dev/serial0"
baud_rate: 9600

# Sensors
dht_gpio: 4
# Soil moisture probe read via an ATtiny over UART. Leave empty to disable.
soil_moisture_serial_port: ""
soil_moisture_baud_rate: 9600
# Raw ATtiny ADC values calibrated for dry air and submerged in water.
soil_moisture_raw_dry: 1023
soil_moisture_raw_wet: 0

# Light sensor (LDR / photoresistor) read via an ATtiny over UART. Leave empty
# to disable.
light_serial_port: ""
light_baud_rate: 9600
# Raw ATtiny ADC values calibrated for darkness and full brightness.
light_raw_dark: 0
light_raw_bright: 1023

# Actuators
sun_light_relay_gpio: 19
heater_relay_gpio: 26
watering_relay_gpio: 6
